# =============================================================================
# dsh-opencodeconnect-nokey —— 插件自带的 bundle patch
# =============================================================================
# ⚠️ 这个文件必须是**空数组**，不能在这里挂载插件自己。
#
# 踩过的坑：最初这里写了一条
#     - insert:
#         - id: opencodeconnect-nokey
#           name: dsh-opencodeconnect-nokey
# 结果插件在 DSH 里**静默不加载** —— 没有日志、没有 shim 端口、
# 模型选择器里也没有 provider。
#
# 原因是加载链路会套两层 patch：
#   1. profile 的 cordis.patch.yml 先 insert 了本插件（用户侧那三行）
#   2. 本插件 package.json 的 dsh.bundle.patch 又指向这个文件，
#      loader 会把插件自带的 patch 再叠加一层
#
# 于是同一个 id 被插入了两次，第二次是「一个叫 A 的行去 insert 一个叫 A 的行」
# 的自引用。loader 遇到重复 id 不报错，只是不再启动那一行。
#
# 正确做法（对照 dsh-xdpool / dsh-bili-whale 等已验证插件）：
#   - profile 的 patch 负责**挂载插件**（用户侧那三行）
#   - 插件自带的 patch 只负责**插件内部**要补充的行
#
# 本插件没有内部子行要注册 —— provider 是在 apply() 里用
# ctx.llm.registerAdapter() 动态注册的，不走 loader 行。
# 所以这里就是一个空数组。
#
# 保留这个文件（而不是删掉）是因为 package.json 的 dsh.bundle.patch 指向它，
# loader 期望它存在且可解析。
# =============================================================================
[]
